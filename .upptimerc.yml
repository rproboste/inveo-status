owner: rproboste
repo: inveo-status
user-agent: inveo-status
delay: 5000
skipDescriptionUpdate: false
skipTopicsUpdate: false
skipHomepageUpdate: false

sites:
  - name: Portal
    url: https://inveo.cl/
    headers: ["User-Agent: InveoStatus/1.0 (+https://status.inveo.cl)"]
    maxResponseTime: 3000
  - name: Inicio de sesión
    url: https://auth.inveo.cl/.well-known/openid-configuration
    headers: ["User-Agent: InveoStatus/1.0 (+https://status.inveo.cl)"]
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: authorization_endpoint
  - name: Radar de licitaciones
    url: https://radar.inveo.cl/
    headers: ["User-Agent: InveoStatus/1.0 (+https://status.inveo.cl)"]
    maxResponseTime: 3000
  - name: API
    url: https://api.inveo.cl/ip/v1/
    headers: ["User-Agent: InveoStatus/1.0 (+https://status.inveo.cl)"]
    maxResponseTime: 3000

status-website:
  cname: status.inveo.cl
  name: Estado de Inveo
  theme: light
  favicon: https://inveo.cl/favicon.svg
  introTitle: Estado público de Inveo
  introMessage: >-
    Comprobamos desde fuera, desde la nube de GitHub, la disponibilidad de solo
    cuatro servicios de [Inveo](https://inveo.cl) cada 5 minutos: Portal,
    Inicio de sesión, Radar de licitaciones y API. No hay datos anteriores a
    la puesta en marcha. «Degradado» significa una respuesta de más de 3 segundos.
    Las mantenciones anunciadas se excluyen según su programación en Upptime.
    [Contacto y soporte](mailto:contacto@inveo.cl).
  navbar:
    - title: Estado
      href: /
    - title: Inveo
      href: https://inveo.cl
  robotsText: |
    User-agent: *
    Allow: /
